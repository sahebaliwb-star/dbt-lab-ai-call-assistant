name: Build DBT LAB AI Call Assistant

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q DBT_LAB_AI_Call_Assistant.zip -d android-project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android-project assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: DBT-LAB-AI-Call-Assistant-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          
